[build]
builder = "NIXPACKS"

[deploy]
numReplicas = 1
# Run Alembic migrations first, then start the API
startCommand = "bash -lc 'alembic upgrade head && gunicorn -c gunicorn_conf.py app.main:app'"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"

[[services]]
name = "api"
# Run Alembic migrations first, then start the API
startCommand = "bash -lc 'alembic upgrade head && gunicorn -c gunicorn_conf.py app.main:app'"
healthcheckPath = "/health"
env = [
  "ENV",
  "PORT",
  "DATABASE_URL",
  "REDIS_URL",
  "AWS_REGION",
  "AWS_S3_BUCKET",
  "AWS_ACCESS_KEY_ID",
  "AWS_SECRET_ACCESS_KEY",
  "STRIPE_API_KEY",
  "STRIPE_WEBHOOK_SECRET",
  "CLERK_JWKS_URL",
  "CLERK_ISSUER",
  "CLERK_AUDIENCE",
  "SENTRY_DSN",
  "CORS_ORIGINS"
]
